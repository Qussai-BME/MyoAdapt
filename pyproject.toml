[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myoadapt"
version = "2.0.0"
description = "Research-only CPU-native sEMG pattern-recognition software with evaluation and deployment utilities."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "MyoAdapt Contributors" },
]
maintainers = [
    { name = "MyoAdapt Contributors", email = "adlbiqussai@gmail.com" },
]
keywords = [
    "emg", "semg", "electromyography", "pattern-recognition",
    "domain-adaptation", "adversarial", "lite-dan", "minirocket",
    "prosthetics", "myoelectric-control", "edge-deployment", "onnx",
    "explainable-ai", "eu-ai-act", "NinaPro",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "tqdm>=4.60",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "joblib>=1.1",
    "fastapi>=0.95",
    "uvicorn[standard]>=0.20",
    "websockets>=10.0",
    "streamlit>=1.25",
    "optuna>=3.0",
    "cmaes>=0.10",  # optuna's CmaEsSampler lazily imports this at sample time,
                    # not at optuna import time -- not pulled in automatically
    "tabulate>=0.9",
    "PyWavelets>=1.3",
    "cryptography>=50.0.0",  # security floor for PYSEC-2026-3552
]

[project.optional-dependencies]
ml = [
    "xgboost>=1.6",
    "lightgbm>=3.3",
    "torch>=2.0",
    "numba>=0.56",
]
onnx = [
    "onnx>=1.13",
    "onnxruntime>=1.14",
    "skl2onnx>=1.14",
]
explain = [
    "shap>=0.42",
]
# MLflow tracking is intentionally not packaged in this release. Available
# resolver candidates conflict with the required cryptography security floor.
# Keep local JSON tracking for the hardened research distribution.
tracking = []
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.22",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1",
    "mypy>=1.0,<2.0",
    "pre-commit>=3.0",
    "httpx>=0.24",
]
all = [
    "xgboost>=1.6",
    "lightgbm>=3.3",
    "torch>=2.0",
    "numba>=0.56",
    "onnx>=1.13",
    "onnxruntime>=1.14",
    "skl2onnx>=1.14",
    "shap>=0.42",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.22",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1",
    "mypy>=1.0,<2.0",
    "pre-commit>=3.0",
    "tabulate>=0.9",
    "PyWavelets>=1.3",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/Qussai-BME/MyoAdapt"
Documentation = "https://github.com/Qussai-BME/MyoAdapt#readme"
Repository = "https://github.com/Qussai-BME/MyoAdapt"
"Bug Tracker" = "https://github.com/Qussai-BME/MyoAdapt/issues"

[project.scripts]
myoadapt = "myoadapt.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["myoadapt*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "regression: marks regression tests against known results",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "C4"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
